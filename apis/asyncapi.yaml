              throughputCap: { value: 400, timeUnit: HOUR, unit: ORDER }
              declaredBy: VENDOR

  schemas:
    CloudEventEnvelope:
      type: object
      required: [specversion, id, source, type, subject, time, datacontenttype, dataschema, data]
      properties:
        specversion: { type: string, const: "1.0" }
        id: { type: string, description: The CloudEvents id; the idempotency key of every consumer. }
        source: { type: string }
        type: { type: string }
        subject: { type: string, description: The aggregate root id of the producer. }
        time: { type: string, format: date-time }
        datacontenttype: { type: string, const: application/json }
        dataschema: { type: string }

    ScorecardWindow:
      type: string
      enum: ["7d", "30d"]

    ScorecardGrade:
      type: string
      enum: [A, B, C, D, PROVISIONAL]

    NodeScorecardUpdatedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            source: { const: /retailnetwork/node-performance }
            data:
              type: object
              required: [nodeId, window, grade, onTimeHandoverRate, lateAckRate, rejectRate, expiryRate, promiseKeptRate, feedFreshnessP95Minutes, observations, computedAt]
              properties:
                nodeId: { type: string }
                window: { $ref: "#/components/schemas/ScorecardWindow" }
                grade: { $ref: "#/components/schemas/ScorecardGrade" }
                onTimeHandoverRate: { type: number, minimum: 0, maximum: 1 }
                lateAckRate: { type: number, minimum: 0, maximum: 1 }
                rejectRate: { type: number, minimum: 0, maximum: 1 }
                expiryRate: { type: number, minimum: 0, maximum: 1 }
                promiseKeptRate: { type: number, minimum: 0, maximum: 1 }
                feedFreshnessP95Minutes: { type: integer, minimum: 0 }
                observations: { type: integer, minimum: 0 }
                computedAt: { type: string, format: date-time }

    NodeThresholdBreachedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            source: { const: /retailnetwork/node-performance }
            data:
              type: object
              required: [nodeId, metric, value, threshold, window]
              properties:
                nodeId: { type: string }
                metric:
                  type: string
                  enum: [onTimeHandoverRate, lateAckRate, rejectRate, expiryRate, promiseKeptRate, feedFreshnessP95Minutes]
                value: { type: number, minimum: 0 }
                threshold: { type: number, minimum: 0 }
                window: { $ref: "#/components/schemas/ScorecardWindow" }

    VendorOnboardedEvent:
      allOf:
        - $ref: "#/components/schemas/CloudEventEnvelope"
        - type: object
          properties:
            type: { const: "com.retailnetwork.partner.vendor-connectivity.vendoraccount.VendorOnboarded" }
            data:
              type: object
              required: [vendorId]
              properties:
                vendorId: { type: string }
    PurchaseOrderIssuedEvent:
