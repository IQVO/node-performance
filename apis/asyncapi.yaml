            time: "2026-10-24T01:00:05Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:delivery-promise:events:PromiseKept:v1"
            data:
              promiseId: "prm-7f3a21"
              orderId: "ord-55a901"
              nodeId: "node-0f3a91"
              deliveredAt: "2026-10-24T01:00:00Z"
              deliverByLatest: "2026-10-24T02:00:00Z"
    PromiseBroken:
      name: PromiseBroken
      title: Promise broken
      summary: A delivery promise was broken.
      description: "`type` = `com.retailnetwork.commerce.delivery-promise.promise.PromiseBroken`, from delivery-promise. Fields relied on: nodeId, cause; deliveredAt is optional. LATE counts against the node, LOST and RETURNED do not, and the G33 literals LATE_HANDOVER, VENDOR_REJECT and ACK_EXPIRED count too if a producer ever sends them (ADR 0002, A8). Records a broken-promise observation at deliveredAt, else at the envelope time. Every other field is ignored."
      contentType: application/cloudevents+json
      tags:
        - name: consumed
      payload:
        $ref: "#/components/schemas/PromiseBrokenEvent"
      examples:
        - name: promiseBroken
          summary: A delivery promise was broken.
          payload:
            specversion: "1.0"
            id: "3f6c2a9e-8b1d-4c7a-9e55-0d2f6b7a1c19"
            source: "/retailnetwork/delivery-promise"
            type: "com.retailnetwork.commerce.delivery-promise.promise.PromiseBroken"
            subject: "prm-7f3a21"
            time: "2026-10-24T03:00:05Z"
            datacontenttype: "application/json"
            dataschema: "urn:retailnetwork:delivery-promise:events:PromiseBroken:v1"
            data:
              promiseId: "prm-7f3a21"
              orderId: "ord-55a901"
              nodeId: "node-0f3a91"
              deliveredAt: "2026-10-24T03:00:00Z"
              deliverByLatest: "2026-10-24T02:00:00Z"
              lateByMinutes: 60
              cause: LATE
    InventoryFeedApplied:
      name: InventoryFeedApplied
      title: Inventory feed applied
      summary: An inventory feed reached APPLIED.
      description: "`type` = `com.retailnetwork.commerce.offer-availability.inventoryfeed.InventoryFeedApplied`, from offer-availability. Fields relied on: nodeId, appliedAt. Records a feed observation at appliedAt; freshness samples are the gaps between consecutive feeds of the node (ADR 0002, A9). Every other field is ignored."
