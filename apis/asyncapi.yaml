      description: "`type` = `com.retailnetwork.logistics.node-topology.node.NodeOperationalProfileDeclared`, from node-topology. Fields relied on: nodeId. The declared profile is what a scorecard is measured against, never an input of it (ADR 0002, A4). Recorded in the inbox only. Every other field is ignored."
