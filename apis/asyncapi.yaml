      title: Node registered
      summary: A node was registered in state PROPOSED.
      description: "`type` = `com.retailnetwork.logistics.node-topology.node.NodeRegistered`, from node-topology. Fields relied on: nodeId. No scorecard metric reads it: a scorecard is built from observed facts, never from a declaration (ADR 0002, A4). Recorded in the inbox only. Every other field is ignored."
