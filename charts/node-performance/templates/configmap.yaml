# Non-secret configuration of the api, mirrored from the env the Deployment
# renders and mounted into the api container with envFrom (the explicit env
# entries win for the same key); the Deployment's checksum/config annotation
# rolls the pods whenever any of it changes. Every key is a variable cmd/api
# reads (tests/render_test.sh). DATABASE_URL never lands here: it lives in the
# Secret (templates/secret.yaml or database.existingSecret).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "node-performance.fullname" . }}
  labels:
    {{- include "node-performance.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  HTTP_ADDR: {{ .Values.config.httpAddr | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  RECOMPUTE_INTERVAL: {{ .Values.config.recomputeInterval | quote }}
  OUTBOX_RELAY_INTERVAL: {{ .Values.config.outboxRelayInterval | quote }}
  OUTBOX_MAX_ATTEMPTS: {{ .Values.config.outboxMaxAttempts | quote }}
  SHUTDOWN_DRAIN_DELAY: {{ .Values.config.shutdownDrainDelay | quote }}
  KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
  VENDOR_CONNECTIVITY_CONSUMER_GROUP: {{ .Values.config.vendorConnectivityConsumerGroup | quote }}
  SHIPPING_AND_TRACKING_CONSUMER_GROUP: {{ .Values.config.shippingAndTrackingConsumerGroup | quote }}
  DELIVERY_PROMISE_CONSUMER_GROUP: {{ .Values.config.deliveryPromiseConsumerGroup | quote }}
  OFFER_AVAILABILITY_CONSUMER_GROUP: {{ .Values.config.offerAvailabilityConsumerGroup | quote }}
  NODE_TOPOLOGY_CONSUMER_GROUP: {{ .Values.config.nodeTopologyConsumerGroup | quote }}
