apiVersion: v1
kind: Service
metadata:
  name: {{ include "node-performance.fullname" . }}
  labels:
    {{- include "node-performance.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component=api keeps this Service on exactly one Deployment
  # (tests/test_service_selectors.py).
  selector:
    {{- include "node-performance.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
