# Default values for node-performance.
#
# One component: the api (cmd/api: REST, six Kafka consumers, the recompute
# scheduler and the outbox relay in ONE process). No MCP server, frontend,
# projector or reports binary exists in this service.

replicaCount: 1

# Empty tag = "v" + the chart's appVersion, which is how the `release` job
# tags the published image (ghcr.io/iqvo/node-performance:vX.Y.Z; the chart is
# packaged with --app-version X.Y.Z). Set image.tag for a local or SHA tag.
image:
  repository: ghcr.io/iqvo/node-performance
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# The image runs as uid/gid 1000 and writes nothing to disk (logs go to
# stdout, migrations are embedded), so the root filesystem is read-only.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: node-performance.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API alternative to the ingress: block above. Off by default; routes
# only to the api Service.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) for the api Deployment, off by
# default. When enabled the Deployment omits replicas so the HPA owns them.
# N>1 is safe by design (the outbox relay claims rows with FOR UPDATE SKIP
# LOCKED, aggregate writes are version-guarded, consumers share one STABLE
# group per topic and dedupe on the CloudEvents id) but it has not been
# load-tested.
autoscaling:
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

# Environment read by cmd/api (cmd/api/config.go). Every key maps 1:1 to one
# env var; the chart renders exactly the variables the binary reads.
config:
  httpAddr: ":8080"                  # HTTP_ADDR; its port must equal service.targetPort
  logLevel: "info"                   # LOG_LEVEL: debug | info | warn (or warning) | error
  recomputeInterval: "1m"            # RECOMPUTE_INTERVAL: Go duration or plain seconds
  outboxRelayInterval: "1s"          # OUTBOX_RELAY_INTERVAL: Go duration or plain seconds
  # OUTBOX_MAX_ATTEMPTS (ADR 0005): failures before the relay excludes an
  # outbox row from claims; 0 = unlimited.
  outboxMaxAttempts: 20
  # SHUTDOWN_DRAIN_DELAY: wait between flipping /readyz to 503 and closing the
  # listener. Whole seconds ("5s" or "5"); "0" disables. The chart refuses a
  # terminationGracePeriodSeconds below this + 35.
  shutdownDrainDelay: "5s"
  # The six consumer group ids. REQUIRED: the chart refuses to render an
  # empty one and the binary refuses to boot without it. Use a STABLE,
  # service-prefixed id (never the pod name), so a rescheduled pod resumes
  # from its committed offsets.
  vendorConnectivityConsumerGroup: ""    # VENDOR_CONNECTIVITY_CONSUMER_GROUP
  shippingAndTrackingConsumerGroup: ""   # SHIPPING_AND_TRACKING_CONSUMER_GROUP
  deliveryPromiseConsumerGroup: ""       # DELIVERY_PROMISE_CONSUMER_GROUP
  offerAvailabilityConsumerGroup: ""     # OFFER_AVAILABILITY_CONSUMER_GROUP
  nodeTopologyConsumerGroup: ""          # NODE_TOPOLOGY_CONSUMER_GROUP
  sellerInboundConsumerGroup: ""         # SELLER_INBOUND_CONSUMER_GROUP

# The chart refuses to render unless database.url or database.existingSecret
# is set. DATABASE_URL always reaches the pod through a secretKeyRef, never
# through the ConfigMap.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"
  # Key, in the same secret, of a DIRECT (non-pooled, session-mode) Postgres
  # DSN used only for the boot migrations. Rendered with `optional: true`: a
  # secret without the key still starts the pod and the binary falls back to
  # DATABASE_URL. Empty = not rendered.
  migrationsExistingSecretKey: "MIGRATIONS_DATABASE_URL"

# KAFKA_BROKERS is mandatory (relay, consumers and the /readyz broker check).
# The chart refuses to render without it. Comma-separated host:port list.
# Produced: retailnetwork.node-performance.events and
# retailnetwork.node-performance.analytics. Consumed: the vendor-connectivity,
# shipping-and-tracking, delivery-promise, offer-availability, seller-inbound and
# node-topology topics.
kafka:
  brokers: ""

# Extra env vars appended to the api container as a raw list. The chart
# refuses any *_MODE variable (this service has no in-memory, log or
# permissive mode) and any variable the chart already renders (a consumer
# group, for one, must come from config.*).
extraEnv: []

# The boot migrations and the Postgres ping are wrapped in a bounded retry
# (5 attempts, 1+2+4+8 = 15 s of backoff), so the startup probe allows ~60 s.
# Once it succeeds liveness takes over; readiness uses /readyz (flipped to
# not-ready as the FIRST step of the graceful shutdown).
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Room for the binary's sequential graceful shutdown: SHUTDOWN_DRAIN_DELAY (5s)
# + HTTP drain (10s) + consumers and scheduler (10s) + outbox relay (10s) =
# 35s. The chart refuses anything under config.shutdownDrainDelay + 35.
terminationGracePeriodSeconds: 40

nodeSelector: {}
tolerations: []
affinity: {}
